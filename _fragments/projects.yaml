projects:
  - title: Leaky-Wave Antenna from Periodically Modulated Reactance Surface
    link: /leaky_wave.html
    image: images/leaky_wave_surface/icon.png
    description:  Design and fabrication of a frequency scanned leaky-wave antenna at X-band (10 GHz) from a parallel plate waveguide with a sinusoidally modulated upper reactance surface.

  - title: Electrically Small Spherical Folded Helix Antenna for GPS
    link: /papers/esa_helix_aps25.pdf
    image: images/esa_helix/header2.png
    description: Design and fabrication of a small ($\lambda/12$ diameter) spherical helix antenna for GPS. Spherical wave expansion is used to directly design antenna and parasitic element geometry that achieves simultaneous high efficiency, low axial ratio, and 50 $\Omega$ matching.

  - title: FDTD wave equation solver
    link: fdtd_wave_eq.html
    image: images/2024-05-28-fdtd-wave-equation/header.png
    description: An interactive finite difference time domain solver for the 2d wave equation, demonstrating various wave phenomenology.

  - title: Fractal Explorer
    link: http://fractal.wawrzynek.com
    image: images/fractal/header3.png
    description: Software for exploring, rendering, and animating fractas, including 2D iterated systems and 3D distance estimated systems.